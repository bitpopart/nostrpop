; MiniBit firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.8 (368x448, CO5300 over QSPI, 16 MB flash).
; Built by .github/workflows/minibit-firmware.yml and published to /bitbot/minibit/firmware/.
; Needs arduino-esp32 3.x, so it uses the pioarduino platform (same as firmware/tribe).
[env:minibit]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.0
    bblanchon/ArduinoJson@^7.2.1
    links2004/WebSockets@^2.6.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; USB-C on the left instead of the right: add  -DMB_FLIP=1  and rebuild screens with tools/make_assets.py flip

; TriBe / POWout firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06 (410x502, CO5300 over QSPI).
; Built by .github/workflows/tribe-firmware.yml and published to /tribe-app/fw/.
; Needs arduino-esp32 3.x, so it uses the pioarduino platform.
[env:powout]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

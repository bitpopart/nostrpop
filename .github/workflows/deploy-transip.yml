name: Deploy to TransIP hosting

# Builds the site and uploads it to the TransIP web hosting on every push to
# main. It does nothing until the secrets below exist, so it is safe to leave
# on. Setup steps: docs/TRANSIP_DEPLOY.md
#   TRANSIP_FTP_HOST   e.g. yourname.transip.me or the FTP host shown in the panel
#   TRANSIP_FTP_USER   FTP/SFTP user from the TransIP panel
#   TRANSIP_FTP_PASS   its password
#   TRANSIP_FTP_DIR    optional, default /www/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transip-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.TRANSIP_FTP_HOST }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$FTP_HOST" ]; then echo "TransIP secrets not set, skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci || npm install
          node scripts/gen-tile-previews.mjs
          npm run build:ci

      - name: Upload to TransIP
        if: steps.gate.outputs.go == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.TRANSIP_FTP_HOST }}
          username: ${{ secrets.TRANSIP_FTP_USER }}
          password: ${{ secrets.TRANSIP_FTP_PASS }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.TRANSIP_FTP_DIR || '/www/' }}

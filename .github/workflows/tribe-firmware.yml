name: TriBe firmware

# Builds firmware/tribe, publishes app.bin (update, 0x10000) and full.bin (new
# device, 0x0) to public/tribe-app/fw/<version>/ and lists it in manifest.json.
# The /tribe flasher reads that manifest. Bump firmware/tribe/VERSION to release.
on:
  push:
    branches: [main]
    paths: ["firmware/tribe/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tribe-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO and esptool
        run: |
          pip install platformio esptool
          pio --version
          # esptool 5 inside the PlatformIO env breaks with click 8.2+
          ~/.platformio/penv/bin/python -m pip install "click<8.2" || pip install "click<8.2"
      - name: Build
        working-directory: firmware/tribe
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "#define FW_VERSION \"$V\"" > src/version.h
          mkdir -p ../../docs
          set -o pipefail
          pio run 2>&1 | tee ../../docs/tribe-build-full.txt
      - name: Library info
        if: always()
        run: |
          mkdir -p docs
          {
            echo "=== LIB INFO ==="
            D=$(find firmware/tribe/.pio/libdeps -maxdepth 2 -type d -name 'Arduino_GFX*' | head -1)
            echo "dir: $D"
            grep -n -B1 -A6 "Arduino_CO5300(" "$D/src/display/Arduino_CO5300.h" || true
            grep -n -A3 "Arduino_Canvas(" "$D/src/canvas/Arduino_Canvas.h" || true
            grep -n "bool begin" "$D/src/canvas/Arduino_Canvas.h" || true
            grep -rn "GFX_SKIP_OUTPUT_BEGIN" "$D/src/Arduino_GFX.h" "$D/src/databus/Arduino_DataBus.h" | head -3 || true
          } >> docs/tribe-build-full.txt
      - name: Publish
        run: |
          set -e
          V=$(tr -d '[:space:]' < firmware/tribe/VERSION)
          B=firmware/tribe/.pio/build/powout
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          OUT=public/tribe-app/fw/$V
          mkdir -p "$OUT"
          cp "$B/firmware.bin" "$OUT/app.bin"
          python -m esptool --chip esp32s3 merge_bin -o "$OUT/full.bin" \
            --flash_mode qio --flash_size 32MB \
            0x0 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" 0xe000 "$BOOT" 0x10000 "$B/firmware.bin"
          python - <<PY
          import json,hashlib,os,datetime
          v="$V"; d="public/tribe-app/fw/"+v
          sha=lambda p:hashlib.sha256(open(p,'rb').read()).hexdigest()
          m="public/tribe-app/fw/manifest.json"
          lst=json.load(open(m)) if os.path.exists(m) else []
          lst=[x for x in lst if x["version"]!=v]
          lst.insert(0,{"version":v,"date":datetime.date.today().isoformat(),
            "notes":open("firmware/tribe/NOTES").read().strip(),
            "app":v+"/app.bin","full":v+"/full.bin",
            "sha256_app":sha(d+"/app.bin"),"sha256_full":sha(d+"/full.bin")})
          json.dump(lst,open(m,"w"),indent=1)
          print(json.dumps(lst[0],indent=1))
          PY
          ls -l "$OUT"
      - name: Commit and redeploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f docs/tribe-build-full.txt ] && tail -n 120 docs/tribe-build-full.txt > docs/tribe-build.txt
          rm -f docs/tribe-build-full.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tribe-app/fw docs/tribe-build.txt
          git diff --cached --quiet && exit 0
          PUB=$(git diff --cached --name-only | grep -c '^public/tribe-app/fw' || true)
          git commit -m "TriBe firmware build result"
          git pull --rebase --autostash
          git push
          [ "$PUB" -gt 0 ] && gh workflow run deploy.yml || true

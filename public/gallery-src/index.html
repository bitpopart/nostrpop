.btns { display:flex; gap:8px; }

.pbtn.cta { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAICAIAAAC+v2ApAAAAVklEQVR4nO2RMQoAIAwD0zzCj/p6pzrooIiDIGTJDVIM1NaLVktmAIFx7kUeN2uR9wiI2RZ87fz4KL8MfI+47PL9l0gYKRYgxgLEWIAYCxBjAWIsQEwH1kQ53R4cbQsAAAAASUVORK5CYII=); box-shadow:0 4px 14px rgba(236,72,153,.35); }
.pbtn.red { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGN87+LCAANMDEgANwcASu0BfyDfyvwAAAAASUVORK5CYII=); box-shadow:0 4px 14px rgba(239,68,68,.3); }
.pbtn.ghost { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8/+EpAwwwMSAB3BwAjoYC3BEM60AAAAAASUVORK5CYII=);

.pbtn.small { font-size:12px; padding:7px 12px; border-radius:6px; }

#hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:5;
  background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8//8/AwwwMSAB3BwAlm4DBfIlvvkAAAAASUVORK5CYII=); color:#64748b;
  border:1px solid #e2e8f0; border-radius:9999px; padding:8px 18px;
  font-size:12px; font-weight:500; max-width:92vw; text-align:center;
  box-shadow:0 4px 12px rgba(15,23,42,.08); pointer-events:none; }
#hint b { color:#f97316; font-weight:700; }

#joy { position:fixed; left:22px; bottom:72px; width:118px; height:118px; z-index:6;
  border:1px solid #e2e8f0; border-radius:50%; background:rgba(255,255,255,.45);
  box-shadow:0 6px 18px rgba(15,23,42,.15); touch-action:none; }
#knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
  border-radius:50%; background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAICAIAAAC+v2ApAAAAY0lEQVR4nO2ROw6AMAxDA4fgopyeySwIJa47e/FbWsn5OPLx3BeA+qEvpoBW0iqbhFpVzFqaq+Z8TVtpebox5U0b4+3Ynz+NqRXaGE/lxrOClQRgJgGYSQBmEoCZBGAmAZh5AdknNV59b+FHAAAAAElFTkSuQmCC); background-size:100% 100%;
  box-shadow:0 3px 10px rgba(249,115,22,.4); }

#toast { position:fixed; top:70px; left:50%; transform:translateX(-50%) scale(.9); z-index:8;
  background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAICAIAAAC+v2ApAAAAY0lEQVR4nO2ROw6AMAxDA4fgopyeySwIJa47e/FbWsn5OPLx3BeA+qEvpoBW0iqbhFpVzFqaq+Z8TVtpebox5U0b4+3Ynz+NqRXaGE/lxrOClQRgJgGYSQBmEoCZBGAmAZh5AdknNV59b+FHAAAAAElFTkSuQmCC); background-size:100% 100%;

#splash { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  background:rgba(3,7,18,.62); padding:20px; }
.card { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8//8/AwwwMSAB3BwAlm4DBfIlvvkAAAAASUVORK5CYII=); border:1px solid #e2e8f0;
  border-radius:16px; box-shadow:0 20px 50px rgba(15,23,42,.3); max-width:430px; width:100%;
  padding:30px 28px; text-align:center; }
.card h1 { font-family:'Bangers', Impact, sans-serif; font-size:54px; letter-spacing:3px;
  color:#f97316; line-height:1; }
.card h2 { font-size:13px; font-weight:800; letter-spacing:3px; color:#0f172a;
  text-transform:uppercase; margin:8px 0 14px; }
.card .bar { height:4px; border-radius:9999px; background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAICAIAAAC+v2ApAAAAPklEQVR4nO3RMQ4AIRDDQOcewUd5PdXRI0qkNJ5qtSmdNQf8BAJwHten66M14UNVBigzQJkBygxQZoAyA5Rte1YC6yKjr8QAAAAASUVORK5CYII=);
  background-size:100% 100%; width:120px; margin:0 auto 16px; }
.card p { font-size:14px; line-height:1.6; color:#64748b; margin-bottom:8px; }
.card .big { margin-top:16px; font-size:15px; padding:13px 34px; border-radius:9999px; }

#fileIn, #jsonIn { display:none; }
/* ADMIN LOCK — hidden for everyone by default. Only the logged-in admin's
   injected script removes the .adminLocked class to reveal the button.
   !important guards block any stray reveal scripts from older builds. */
#adminBtn.adminLocked { display:none !important; visibility:hidden !important;
  pointer-events:none !important; position:absolute !important; left:-9999px !important; }
#admin { position:fixed; inset:0; z-index:12; display:none; flex-direction:column;
  background:rgba(3,7,18,.62); padding:14px; }
.apanel { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8/uMnAwwwMSAB3BwAklIC8H7uh+gAAAAASUVORK5CYII=); border:1px solid #e2e8f0;
  border-radius:16px; box-shadow:0 20px 50px rgba(15,23,42,.35); width:100%; max-width:780px;
  margin:0 auto; display:flex; flex-direction:column; max-height:100%; overflow:hidden; }
.ahead { display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:14px 16px; border-bottom:1px solid #e2e8f0; flex-wrap:wrap;
  background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8//8/AwwwMSAB3BwAlm4DBfIlvvkAAAAASUVORK5CYII=); }
.ahead .t { font-size:17px; font-weight:800; color:#0f172a; }
.ahead .abtns { display:flex; gap:6px; flex-wrap:wrap; }
#wallCtl, #propCtl { padding:12px 16px 4px; border-bottom:1px solid #e2e8f0;
  background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8//8/AwwwMSAB3BwAlm4DBfIlvvkAAAAASUVORK5CYII=); }
.ptxt { width:88px; border:1px solid #e2e8f0; border-radius:6px; padding:5px 8px;
  font-family:'Inter Variable', Inter, sans-serif; font-size:12px; font-weight:600; color:#0f172a; }
.ptxt:focus { outline:2px solid #f97316; outline-offset:0; border-color:#f97316; }
.wrow { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
.wname { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  width:96px; color:#64748b; }
.sw { width:24px; height:24px; border:1px solid #e2e8f0; border-radius:6px; cursor:pointer; padding:0; }
.sw.on { outline:2px solid #f97316; outline-offset:1px; }
.swc { width:30px; height:26px; border:1px solid #e2e8f0; border-radius:6px; padding:0;
  background:none; cursor:pointer; }
#adminGrid { overflow-y:auto; padding:14px; display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
.acell { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8//8/AwwwMSAB3BwAlm4DBfIlvvkAAAAASUVORK5CYII=); border:1px solid #e2e8f0;
  border-radius:12px; padding:10px; text-align:center;
  box-shadow:0 4px 12px rgba(249,115,22,.08); }
.acell img { width:100%; aspect-ratio:1; object-fit:cover; border:1px solid #e2e8f0;
  border-radius:8px; display:block; margin:7px 0; }
.anum { font-size:12px; font-weight:600; color:#0f172a; }
.atitle { font-size:11px; font-weight:500; color:#64748b; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.anum .live, #wallCtl .live { display:inline-block; background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAICAIAAAC+v2ApAAAAY0lEQVR4nO2ROw6AMAxDA4fgopyeySwIJa47e/FbWsn5OPLx3BeA+qEvpoBW0iqbhFpVzFqaq+Z8TVtpebox5U0b4+3Ynz+NqRXaGE/lxrOClQRgJgGYSQBmEoCZBGAmAZh5AdknNV59b+FHAAAAAElFTkSuQmCC);
  background-size:100% 100%; color:#fff; font-size:10px; font-weight:700; letter-spacing:.5px;
  border-radius:9999px; padding:2px 8px; vertical-align:1px; }
.arow { display:flex; gap:6px; justify-content:center; }
#dpad { position:fixed; left:22px; bottom:66px; z-index:6; display:grid;
  grid-template-columns:repeat(3,46px); grid-template-rows:repeat(2,46px); gap:6px; }
.dbtn { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP8//8/AwwwMSAB3BwAlm4DBfIlvvkAAAAASUVORK5CYII=); border:1px solid #e2e8f0;
  border-radius:10px; font-size:17px; color:#f97316; cursor:pointer;
  box-shadow:0 4px 12px rgba(15,23,42,.12); touch-action:none; user-select:none; }
.dbtn:active { background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAICAIAAAC+v2ApAAAAY0lEQVR4nO2ROw6AMAxDA4fgopyeySwIJa47e/FbWsn5OPLx3BeA+qEvpoBW0iqbhFpVzFqaq+Z8TVtpebox5U0b4+3Ynz+NqRXaGE/lxrOClQRgJgGYSQBmEoCZBGAmAZh5AdknNV59b+FHAAAAAElFTkSuQmCC); background-size:100% 100%; color:#fff; }
#dUp { grid-column:2; grid-row:1; }
#dLeft { grid-column:1; grid-row:2; }
#dDown { grid-column:2; grid-row:2; }
#dRight { grid-column:3; grid-row:2; }
#zoomCtl { position:fixed; right:14px; bottom:66px; z-index:6; display:flex;
  flex-direction:column; gap:8px; }
.zbtn { width:44px; height:44px; border:none; border-radius:9999px;
  background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAICAIAAAC+v2ApAAAAY0lEQVR4nO2ROw6AMAxDA4fgopyeySwIJa47e/FbWsn5OPLx3BeA+qEvpoBW0iqbhFpVzFqaq+Z8TVtpebox5U0b4+3Ynz+NqRXaGE/lxrOClQRgJgGYSQBmEoCZBGAmAZh5AdknNV59b+FHAAAAAElFTkSuQmCC); background-size:100% 100%;
  color:#fff; font-size:20px; font-weight:700; cursor:pointer;
  box-shadow:0 4px 14px rgba(249,115,22,.35); }
.zbtn:active { transform:translateY(1px); }
@media (max-width:480px) {
  .pbtn { font-size:12px; padding:8px 12px; }
}
</style>

<body>
<script type="application/json" id="galleryData">{}</script>
<div id="world"></div>

<div id="topbar">
  <div class="btns">
    <button class="pbtn" id="viewBtn">FULL VIEW</button>
    <button class="pbtn ghost" id="helpBtn">?</button>
    <button class="pbtn cta adminLocked" id="adminBtn" style="display:none;visibility:hidden;pointer-events:none;position:absolute;left:-9999px">ADMIN</button>
  </div>
</div>

<div id="hint"><b>WALK</b> WASD / joystick &nbsp;·&nbsp; <b>LOOK</b> drag</div>
<div id="joy"><div id="knob"></div></div>
<div id="dpad">
  <button class="dbtn" id="dUp">▲</button>
  <button class="dbtn" id="dLeft">◀</button>
  <button class="dbtn" id="dDown">▼</button>
  <button class="dbtn" id="dRight">▶</button>
</div>
<div id="zoomCtl">
  <button class="zbtn" id="zoomIn">+</button>
  <button class="zbtn" id="zoomOut">−</button>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*">
<input type="file" id="jsonIn" accept="application/json,.json">

<div id="admin">
  <div class="apanel">
    <div class="ahead">
      <span class="t">Gallery Admin</span>
      <div class="abtns">
        <button class="pbtn small" id="expJson">Export JSON</button>
        <button class="pbtn small ghost" id="impJson">Import JSON</button>
        <button class="pbtn small cta" id="expHtml">Export Page</button>
        <button class="pbtn small red" id="resetBtn">Reset</button>
        <button class="pbtn small ghost" id="adminClose">Close ✕</button>
      </div>
    </div>
    <div id="wallCtl"></div>
    <div id="propCtl"></div>
    <div id="adminGrid"></div>
  </div>
</div>

<div id="titleModal" style="display:none; position:fixed; inset:0; z-index:14;
  align-items:center; justify-content:center; background:rgba(3,7,18,.62); padding:20px;">
  <div class="card" style="max-width:360px; padding:22px;">
    <div style="font-size:15px; font-weight:800; color:#0f172a; margin-bottom:10px;">Artwork title</div>
    <input id="titleIn" maxlength="40" placeholder="e.g. Waterpoort Sunset"
      style="width:100%; border:1px solid #e2e8f0; border-radius:8px; padding:10px 12px;
      font-family:'Inter Variable', Inter, sans-serif; font-size:14px; color:#0f172a; margin-bottom:14px;">
    <div style="display:flex; gap:8px; justify-content:center;">
      <button class="pbtn" id="titleSave">Save</button>
      <button class="pbtn ghost" id="titleSkip">Skip</button>
    </div>
  </div>
</div>

<div id="splash">
  <div class="card">
    <h1>POP WORLD</h1>
    <h2>A Walkable BitPopArt Gallery</h2>
    <div class="bar"></div>
    <p>Walk around. 21 frames on the walls, 15 tiles on the floor.</p>
    <p>Drag to look around. Pinch to zoom in on art.</p>
    <button class="pbtn cta big" id="enterBtn">ENTER ⚡</button>
  </div>
</div>
